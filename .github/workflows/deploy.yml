name: Publicar Foco ENEM no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar arquivos do site
        run: curl --fail --location --retry 3 --retry-delay 2 --output site.zip https://github.com/GabrielXeroso/foco-enem/releases/download/site-v1/foco-enem-site.zip
      - name: Extrair site
        run: |
          mkdir public
          unzip -q site.zip -d public
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato para Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
